<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f5f55" />
    <title>Tiro al Aro</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="app" aria-label="Juego Tiro al Aro">
      <section id="gameScreen" class="game-screen" aria-label="Cancha de juego">
        <canvas id="gameCanvas" aria-label="Cancha de baloncesto 2D"></canvas>

        <div class="hud" aria-live="polite">
          <span id="scoreText">Puntos: 0</span>
          <span id="timerText">Tiempo: 45</span>
        </div>

        <div id="message" class="message" role="status" aria-live="polite"></div>
      </section>

      <section id="startScreen" class="screen active" aria-labelledby="gameTitle">
        <div class="panel">
          <p class="eyebrow">Juego móvil 2D</p>
          <h1 id="gameTitle">Tiro al Aro</h1>
          <p class="instruction">Arrastra hacia atrás y suelta para lanzar</p>
          <p id="bestScoreStart" class="best-score">Mejor récord: 0</p>
          <button id="playButton" class="primary-button" type="button">Jugar</button>
        </div>
      </section>

      <section id="endScreen" class="screen" aria-labelledby="finalTitle">
        <div class="panel">
          <p class="eyebrow">Tiempo terminado</p>
          <h2 id="finalTitle">Fin del juego</h2>
          <p id="finalScore" class="final-score">Puntuación final: 0</p>
          <p id="bestScoreEnd" class="best-score">Mejor récord: 0</p>
          <div class="button-row">
            <button id="restartButton" class="primary-button" type="button">Jugar otra vez</button>
            <button id="homeButton" class="secondary-button" type="button">Inicio</button>
          </div>
        </div>
      </section>
    </main>

    <script src="game.js" defer></script>
  </body>
</html>
